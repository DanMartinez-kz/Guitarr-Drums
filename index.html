<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  <title>Pads MIDI Fullscreen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Pads I–VII -->
  <div class="pad midi" data-midi="60">
    <div class="pad-label">I</div>
    <div class="subpads">
      <div class="subpad">↓</div>
      <div class="subpad">↑</div>
      <div class="subpad">B</div>
      <div class="subpad">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="62">
    <div class="pad-label">II</div>
    <div class="subpads">
      <div class="subpad">↓</div>
      <div class="subpad">↑</div>
      <div class="subpad">B</div>
      <div class="subpad">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="64">
    <div class="pad-label">III</div>
    <div class="subpads">
      <div class="subpad">↓</div>
      <div class="subpad">↑</div>
      <div class="subpad">B</div>
      <div class="subpad">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="65">
    <div class="pad-label">IV</div>
    <div class="subpads">
      <div class="subpad">↓</div>
      <div class="subpad">↑</div>
      <div class="subpad">B</div>
      <div class="subpad">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="67">
    <div class="pad-label">V</div>
    <div class="subpads">
      <div class="subpad">↓</div>
      <div class="subpad">↑</div>
      <div class="subpad">B</div>
      <div class="subpad">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="69">
    <div class="pad-label">VI</div>
    <div class="subpads">
      <div class="subpad">↓</div>
      <div class="subpad">↑</div>
      <div class="subpad">B</div>
      <div class="subpad">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="71">
    <div class="pad-label">VII</div>
    <div class="subpads">
      <div class="subpad">↓</div>
      <div class="subpad">↑</div>
      <div class="subpad">B</div>
      <div class="subpad">b</div>
    </div>
  </div>

  <!-- Pad VIII batería -->
  <div class="pad drum" data-drum="kick">
    <div class="pad-label">Drum</div>
    <div class="subpads">
      <div class="subpad">K</div>
      <div class="subpad">H</div>
      <div class="subpad">sS</div>
      <div class="subpad">S</div>
    </div>
  </div>
  <script src="js/midi.js"></script>
  <script src="js/playNotes.js"></script>
</body>
</html>
