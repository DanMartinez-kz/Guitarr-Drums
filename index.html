<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pads MIDI Fullscreen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <audio id="palmMute" src="palmMute.wav" preload="auto"></audio>
  
    <div class="opciones" id="volumenes">
    <div class="slider-container">
      <label>Guitarr: <input type="range" class="vol" data-ch="1" min="0" max="127" value="100"></label>
    </div>
    <div class="slider-container">
      <label>Bass: <input type="range" class="vol" data-ch="9" min="0" max="127" value="127"></label>
    </div>
    <div class="slider-container">
      <label>Drums: <input type="range" class="vol" data-ch="10" min="0" max="127" value="100"></label>
    </div>
  </div>

  <!-- Pads con nombres de acordes -->
  <div class="pad midi" data-midi="60">
    <div class="pad-label">Am</div>
    <div class="subpads">
      <div class="corner top-right" id="crn1"></div>
      <div class="subpad arrow">↓</div>
      <div class="subpad arrow">↑</div>
      <div class="subpad" id="pad1-B">B</div>
      <div class="subpad" id="pad1-b">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="62">
    <div class="pad-label">Em</div>
    <div class="subpads">
      <div class="corner top-right" id="crn2"></div>
      <div class="subpad arrow">↓</div>
      <div class="subpad arrow">↑</div>
      <div class="subpad" id="pad2-B">B</div>
      <div class="subpad" id="pad2-b">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="64">
    <div class="pad-label">F</div>
    <div class="subpads">
      <div class="corner top-right" id="crn3"></div>
      <div class="subpad arrow">↓</div>
      <div class="subpad arrow">↑</div>
      <div class="subpad" id="pad3-B">B</div>
      <div class="subpad" id="pad3-b">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="65">
    <div class="pad-label">Dm</div>
    <div class="subpads">
      <div class="corner top-right" id="crn4"></div>
      <div class="subpad arrow">↓</div>
      <div class="subpad arrow">↑</div>
      <div class="subpad" id="pad4-B">B</div>
      <div class="subpad" id="pad4-b">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="67">
    <div class="pad-label">C</div>
    <div class="subpads">
      <div class="corner top-right" id="crn5"></div>
      <div class="subpad arrow">↓</div>
      <div class="subpad arrow">↑</div>
      <div class="subpad" id="pad5-B">B</div>
      <div class="subpad" id="pad5-b">b</div>
    </div>
  </div>
<div class="pad drum" data-drum="drum">
  <div class="pa"></div>
  <div class="subpads">
    <div class="subpad D mTom" id="crnmT">MT</div>
    <div class="subpad D lTom" id="crnlT">LT</div>
    <div class="subpad D hTom" id="crnhT">HT</div>
    <div class="subpad D pRide" id="crnpR">R</div>
  </div>
</div>
  <div class="pad midi" data-midi="69">
    <div class="pad-label">G</div>
    <div class="subpads">
      <div class="corner top-right" id="crn6"></div>
      <div class="subpad arrow">↓</div>
      <div class="subpad arrow">↑</div>
      <div class="subpad" id="pad6-B">B</div>
      <div class="subpad" id="pad6-b">b</div>
    </div>
  </div>

  <!-- Pad VIII batería -->
<div class="pad drum" data-drum="drum">
  <div class="pad-label"></div>
  <div class="subpads">
    <div class="subpad D snare" id="crnS">S</div>
    <div class="subpad D hiHat" id="crnhH">HH</div>
    <div class="subpad D pCrash" id="crnpC">C</div>
    <div class="subpad D kick" id="crnK">K</div>
  </div>
</div>
  
  <select id="midiSelect"></select>
  <div class="opciones" id="tonalidad">
    <select id="tonoSelect"></select>
    <form id="estructura">
      <label>
        <input type="radio" name="estr" value="mayor" checked>mayor
      </label>
      <label>
        <input type="radio" name="estr" value="menor">menor
      </label>
    </form>
  </div>

  <script src="js/midi.js"></script>
  <script src="js/pisadasMap.js"></script>
  <script src="js/playNotes.js"></script>
  <script src="js/ajustes.js"></script>
  <script src="js/tonalidad.js"></script>
</body>
</html>
