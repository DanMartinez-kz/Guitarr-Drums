<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pads MIDI Fullscreen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Pads con nombres de acordes -->
  <div class="pad midi" data-midi="60">
    <div class="pad-label">C</div>
    <div class="subpads">
      <div class="subpad arrow">↓</div>
      <div class="subpad arrow">↑</div>
      <div class="subpad" id="pad1-B">B</div>
      <div class="subpad" id="pad1-b">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="62">
    <div class="pad-label">C7</div>
    <div class="subpads">
      <div class="subpad arrow">↓</div>
      <div class="subpad arrow">↑</div>
      <div class="subpad" id="pad2-B">B</div>
      <div class="subpad" id="pad2-b">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="64">
    <div class="pad-label">Dm</div>
    <div class="subpads">
      <div class="subpad arrow">↓</div>
      <div class="subpad arrow">↑</div>
      <div class="subpad" id="pad3-B">B</div>
      <div class="subpad" id="pad3-b">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="65">
    <div class="pad-label">Em</div>
    <div class="subpads">
      <div class="subpad arrow">↓</div>
      <div class="subpad arrow">↑</div>
      <div class="subpad" id="pad4-B">B</div>
      <div class="subpad" id="pad4-b">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="67">
    <div class="pad-label">F</div>
    <div class="subpads">
      <div class="subpad arrow">↓</div>
      <div class="subpad arrow">↑</div>
      <div class="subpad" id="pad5-B">B</div>
      <div class="subpad" id="pad5-b">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="69">
    <div class="pad-label">G</div>
    <div class="subpads">
      <div class="subpad arrow">↓</div>
      <div class="subpad arrow">↑</div>
      <div class="subpad" id="pad6-B">B</div>
      <div class="subpad" id="pad6-b">b</div>
    </div>
  </div>
  <div class="pad midi" data-midi="71">
    <div class="pad-label">Am</div>
    <div class="subpads">
      <div class="subpad arrow">↓</div>
      <div class="subpad arrow">↑</div>
      <div class="subpad" id="pad7-B">B</div>
      <div class="subpad" id="pad7-b">b</div>
    </div>
  </div>

  <!-- Pad VIII batería -->
  <div class="pad drum" data-drum="kick">
    <div class="pad-label">Drum</div>
    <div class="subpads">
      <div class="subpad">sS</div>
      <div class="subpad">H</div>
      <div class="subpad">K</div>
      <div class="subpad">S</div>
    </div>
  </div>
  <select id="midiSelect"></select>

  <script src="js/midi.js"></script>
  <script src="js/pisadasMap.js"></script>
  <script src="js/playNotes.js"></script>
</body>
</html>
